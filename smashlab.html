<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SmashLab — اطلب دلوقتي</title>
<style>
  html,body{height:100%;margin:0;font-family:'Segoe UI',Tahoma,sans-serif;background:#141414;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
  .box{padding:24px;max-width:420px}
  .logo{font-size:30px;font-weight:900;letter-spacing:-.5px;color:#E2231A}
  .t{font-size:23px;font-weight:800;margin-top:18px;line-height:1.45}
  .s{font-size:15px;opacity:.72;margin-top:10px;line-height:1.6}
  .btn{display:block;margin:26px auto 0;background:#E2231A;color:#fff;text-decoration:none;
       font-size:20px;font-weight:800;padding:18px 26px;border-radius:14px;
       box-shadow:0 6px 22px rgba(226,35,26,.42);transition:transform .12s}
  .btn:active{transform:scale(.97)}
  .btn2{display:block;margin:14px auto 0;background:transparent;color:#fff;text-decoration:none;
        font-size:17px;font-weight:700;padding:15px 26px;border-radius:14px;
        border:2px solid rgba(255,255,255,.28);transition:transform .12s}
  .btn2:active{transform:scale(.97)}
  .num{direction:ltr;display:inline-block}
  .note{font-size:13px;opacity:.5;margin-top:16px}
</style>
<!-- TikTok Pixel -->
<script>
!function (w, d, t) {
  w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];
  ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"];
  ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};
  for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);
  ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e};
  ttq.load=function(e,n){var r="https://analytics.tiktok.com/i18n/pixel/events.js",o=n&&n.partner;ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=r,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};var s=document.createElement("script");s.type="text/javascript",s.async=!0,s.src=r+"?sdkid="+e+"&lib="+t;var a=document.getElementsByTagName("script")[0];a.parentNode.insertBefore(s,a)};
  ttq.load('D918EORC77U8BPLPP5FG');
  ttq.page();
}(window, document, 'ttq');
</script>
</head>
<body>
<div class="box">
  <div class="logo">SMASHLAB</div>
  <div class="t">أي سندوتش بـ 90 جنيه 🍔</div>
  <a class="btn" id="call" href="tel:01030080097">للطلبات كلمنا على <span class="num">0103 008 0097</span></a>
  <a class="btn2" id="order" href="#" target="_blank" rel="noopener">للمنيو والاستفسارات تواصل معنا</a>
  <div class="note">التوصيل داخل القاهرة</div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var src = q.get('src') || 'tiktok';

  // WhatsApp number 01030080097 was BANNED by Meta (2026-07) — the old wa.me link went nowhere.
  // Orders moved to the phone line, which the ban never touched. Messenger is the secondary
  // path for the menu and questions, and lands in the same inbox as the Meta campaign.
  var PAGE_ID = '996684950202290';

  // m.me passes ?ref= through to the page's messaging referral, so we keep per-post attribution
  // and can still tell TikTok leads apart from Meta ones in the same inbox.
  var ref = ('tt_' + src).replace(/[^A-Za-z0-9_-]/g, '').slice(0, 60);
  document.getElementById('order').href = 'https://m.me/' + PAGE_ID + '?ref=' + ref;

  // Contact fires ONLY on a real tap — it must stay a measure of intent, not of page loads.
  // Orders are taken over the phone; Messenger only handles the menu and questions.
  // Both taps still count as intent, but they are labelled apart so we can weigh them later.
  var fired = false;
  function tap(name) {
    return function () {
      if (fired) return;
      fired = true;
      try { ttq.track('Contact', { content_id: src, content_name: name }); } catch (e) {}
    };
  }
  document.getElementById('order').addEventListener('click', tap('messenger_inquiry'));
  document.getElementById('call').addEventListener('click', tap('call_order'));
</script>
</body>
</html>
